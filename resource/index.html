<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>警务数字证书管理系统</title>
  <style>
    :root {
      --cyan: #45f4ff;
      --cyan-soft: rgba(69, 244, 255, .62);
      --cyan-dim: rgba(69, 244, 255, .18);
      --blue-950: #031a3f;
      --blue-900: #05265a;
      --blue-800: #073b7e;
      --blue-700: #075396;
      --green: #23d17f;
      --gray: #8a96a1;
      --white: #f6fbff;
      --danger: #ffcf4a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #020c1e;
      color: var(--white);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .kiosk-frame {
      position: relative;
      width: 800px;
      height: 1280px;
      overflow: visible;
    }

    .kiosk {
      position: relative;
      width: 800px;
      height: 1280px;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(rgba(3, 18, 49, .18), rgba(3, 18, 49, .24)),
        url("imgs/background.png") center / cover no-repeat,
        radial-gradient(circle at 50% 0%, #0c6cb8 0, var(--blue-900) 34%, var(--blue-950) 100%);
      box-shadow: 0 0 60px rgba(0, 0, 0, .48);
      transform-origin: left top;
    }

    .kiosk::before,
    .kiosk::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .kiosk::before {
      background:
        radial-gradient(circle at 50% 36%, rgba(67, 228, 255, .16), transparent 35%),
        linear-gradient(90deg, rgba(69, 244, 255, .08) 1px, transparent 1px),
        linear-gradient(rgba(69, 244, 255, .08) 1px, transparent 1px);
      background-size: auto, 46px 46px, 46px 46px;
      mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 94%, transparent 100%);
    }

    .kiosk::after {
      background:
        radial-gradient(ellipse at 50% 104%, rgba(67, 228, 255, .35), transparent 34%),
        linear-gradient(to bottom, rgba(0, 0, 0, .1), rgba(0, 0, 0, .18));
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      padding: 48px 54px 44px;
    }

    .screen.active {
      display: block;
    }

    .topline {
      position: relative;
      height: 78px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      text-shadow: 0 5px 0 rgba(4, 18, 42, .9), 0 0 18px rgba(69, 244, 255, .34);
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .topline::before,
    .topline::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 180px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 16px var(--cyan);
    }

    .topline::before {
      left: 0;
    }

    .topline::after {
      right: 0;
    }

    .home-title {
      margin-top: 112px;
      text-align: center;
    }

    .home-title h1 {
      margin: 0;
      font-size: 62px;
      line-height: 1.12;
      font-weight: 900;
      text-shadow: 0 6px 0 rgba(2, 12, 31, .85), 0 0 22px rgba(101, 246, 255, .24);
    }

    .home-title p {
      margin: 28px 0 0;
      font-size: 32px;
      font-weight: 800;
      text-shadow: 0 3px 0 rgba(2, 12, 31, .9);
    }

    .home-actions {
      margin: 142px auto 0;
      width: 300px;
      display: grid;
      gap: 80px;
    }

    .tile-button {
      position: relative;
      height: 250px;
      border: 4px solid var(--cyan);
      border-radius: 18px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(202, 244, 255, .45), rgba(13, 61, 105, .8) 47%, rgba(40, 157, 213, .22) 48%, rgba(5, 31, 76, .92)),
        rgba(5, 65, 111, .78);
      box-shadow:
        0 0 0 6px rgba(69, 244, 255, .18),
        inset 0 0 34px rgba(69, 244, 255, .52),
        0 0 34px rgba(69, 244, 255, .8);
    }

    .tile-button:active,
    .primary-action:active,
    .neon-button:active {
      transform: scale(.98);
    }

    .tile-content {
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .doc-icon {
      width: 104px;
      height: 104px;
      position: relative;
      border: 10px solid #bdfbff;
      border-radius: 20px 20px 30px 30px;
      filter: drop-shadow(0 0 10px rgba(69, 244, 255, .8));
    }

    .doc-icon-retrieve::before {
      content: "";
      position: absolute;
      width: 38px;
      height: 38px;
      top: -10px;
      left: -10px;
      border-right: 10px solid #bdfbff;
      border-bottom: 10px solid #bdfbff;
      border-radius: 0 0 12px 0;
      background: rgba(7, 70, 120, .75);
    }

    .doc-icon-store::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 58px;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 20px solid #bdfbff;
      transform: translateX(-50%);
      filter: drop-shadow(0 0 6px rgba(69, 244, 255, .8));
    }

    .tile-label {
      font-size: 46px;
      font-weight: 900;
      text-shadow: 0 3px 0 rgba(4, 20, 45, .9);
    }

    .settings-button {
      margin: 58px auto 0;
      display: grid;
      gap: 16px;
      justify-items: center;
      width: 220px;
      color: rgba(229, 251, 255, .72);
      background: transparent;
      font-size: 28px;
    }

    .gear {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 8px solid rgba(141, 214, 230, .8);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(69, 244, 255, .36);
    }

    .gear::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(141, 214, 230, .92);
    }

    .subtitle {
      margin: 0;
      text-align: center;
      font-size: 40px;
      line-height: 1.35;
      font-weight: 900;
      text-shadow: 0 4px 0 rgba(3, 15, 37, .8);
    }

    .subtitle.small {
      font-size: 34px;
      color: #dff9ff;
    }

    .panel {
      border: 2px solid rgba(126, 240, 255, .82);
      background: rgba(3, 47, 99, .68);
      box-shadow:
        inset 0 0 30px rgba(36, 174, 255, .28),
        0 0 22px rgba(69, 244, 255, .24);
      backdrop-filter: blur(6px);
    }

    .info-panel {
      position: relative;
      height: 250px;
      margin-top: 70px;
      padding: 40px 42px;
      border-radius: 12px;
    }

    .info-grid {
      display: grid;
      gap: 14px;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.18;
    }

    .info-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      align-items: center;
    }

    .badge {
      display: inline-grid;
      min-width: 86px;
      height: 48px;
      padding: 0 18px;
      place-items: center;
      color: #fff;
      background: var(--green);
      font-size: 30px;
      font-weight: 900;
      box-shadow: 0 0 16px rgba(35, 209, 127, .48);
    }

    .badge.free {
      background: #22c5db;
    }

    .badge.warn {
      background: var(--danger);
      color: #082248;
    }

    .side-status {
      position: absolute;
      right: 34px;
      top: 56px;
      min-width: 116px;
      height: 58px;
      border: 2px solid var(--cyan);
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #22ddef, #1594cb);
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 0 18px rgba(69, 244, 255, .4);
    }

    .slot-panel {
      margin-top: 34px;
      padding: 34px 38px 40px;
      border-radius: 12px;
    }

    #certificateScreen {
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .slot-row {
      height: 136px;
      border: 1px solid rgba(126, 240, 255, .62);
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 10px;
      background: rgba(0, 24, 58, .28);
    }

    .slot-row + .slot-row {
      margin-top: 58px;
    }

    .lock-slot {
      position: relative;
      min-width: 0;
      border-radius: 7px;
      border: 2px solid rgba(245, 251, 255, .72);
      background:
        linear-gradient(#05101e, #05101e) 50% 64px / 17px 40px no-repeat,
        linear-gradient(145deg, #e8f3fb, #758696);
      box-shadow: inset 0 0 12px rgba(255, 255, 255, .45), 0 3px 8px rgba(0, 0, 0, .35);
      -webkit-appearance: none;
      appearance: none;
    }

    .lock-slot.free {
      background:
        linear-gradient(#05101e, #05101e) 50% 64px / 17px 40px no-repeat,
        linear-gradient(145deg, #b8d8ff, #3d7eb8);
      border-color: #6bb5ff;
      box-shadow: inset 0 0 14px rgba(255, 255, 255, .5), 0 0 18px rgba(69, 150, 255, .6);
    }

    .lock-slot.active {
      background:
        linear-gradient(#05101e, #05101e) 50% 64px / 17px 40px no-repeat,
        linear-gradient(145deg, #dbfff2, #57d496);
      border-color: #c7ffe8;
      box-shadow: inset 0 0 14px rgba(255, 255, 255, .6), 0 0 22px rgba(35, 209, 127, .78);
    }

    .lock-slot.target {
      box-shadow: inset 0 0 16px rgba(255, 255, 255, .6), 0 0 30px rgba(69, 244, 255, .9), 0 0 60px rgba(69, 244, 255, .4);
    }

    .lock-slot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 38px;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #05101e;
      transform: translateX(-50%);
      box-shadow: 0 0 0 8px rgba(221, 234, 242, .72);
    }

    .lock-slot.free::before {
      box-shadow: 0 0 0 8px rgba(107, 181, 255, .7);
    }

    .lock-slot.active::before {
      box-shadow: 0 0 0 8px rgba(35, 209, 127, .7);
    }

    .lock-slot.target::before {
      box-shadow: 0 0 0 8px rgba(69, 244, 255, .8);
    }

    .lock-slot::after {
      content: attr(data-num);
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.85);
      pointer-events: none;
    }

    .slot-labels {
      display: flex;
      justify-content: space-between;
      padding: 8px 20px 0 390px;
      color: #f0fbff;
      font-size: 24px;
      font-weight: 900;
    }

    .primary-action {
      width: 420px;
      height: 94px;
      margin: 72px auto 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(180deg, #24d7f1, #0b6eb1);
      border: 3px solid rgba(197, 255, 255, .88);
      border-radius: 12px;
      box-shadow: 0 0 18px rgba(69, 244, 255, .62), inset 0 0 24px rgba(255, 255, 255, .16);
    }

    .primary-action:disabled {
      opacity: .45;
      cursor: default;
    }

    .bottom-tip {
      margin: 64px 0 0;
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      text-shadow: 0 3px 0 rgba(2, 12, 31, .9);
    }

    .auth-card,
    .login-card {
      width: 580px;
      margin: 210px auto 0;
      border-radius: 36px;
      padding: 56px 58px 48px;
    }

    .face-ring {
      width: 260px;
      height: 260px;
      margin: 0 auto 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 4px solid rgba(69, 244, 255, .78);
      background: radial-gradient(circle, rgba(69, 244, 255, .18), rgba(3, 33, 78, .78) 66%);
      box-shadow: inset 0 0 34px rgba(69, 244, 255, .38), 0 0 36px rgba(69, 244, 255, .42);
    }

    .face-ring::before {
      content: "";
      width: 136px;
      height: 136px;
      border-radius: 50%;
      border: 18px solid rgba(223, 251, 255, .86);
      border-bottom-color: transparent;
      box-shadow: inset 0 0 0 28px rgba(223, 251, 255, .18);
    }

    .auth-state {
      text-align: center;
      font-size: 38px;
      font-weight: 900;
    }

    .form-field {
      width: 100%;
      height: 88px;
      margin-bottom: 42px;
      padding: 0 34px;
      border: 2px solid rgba(222, 247, 255, .78);
      border-radius: 14px;
      color: #fff;
      background: rgba(4, 38, 82, .42);
      outline: 0;
      font-size: 34px;
      font-weight: 800;
      box-shadow: inset 0 0 18px rgba(47, 167, 255, .24);
    }

    .form-field::placeholder {
      color: rgba(255, 255, 255, .82);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 42px;
      margin-top: 14px;
    }

    .neon-button {
      height: 86px;
      border: 3px solid var(--cyan);
      border-radius: 42px;
      color: var(--cyan);
      background: rgba(5, 31, 77, .78);
      font-size: 34px;
      font-weight: 900;
      box-shadow: 0 0 18px rgba(69, 244, 255, .38), inset 0 0 18px rgba(69, 244, 255, .2);
    }

    .status-switch {
      margin: 78px auto 66px;
      display: grid;
      gap: 26px;
      justify-items: center;
    }

    .status-switch h2 {
      margin: 0;
      font-size: 42px;
      line-height: 1.2;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 34px;
      width: 520px;
    }

    .segment {
      height: 68px;
      border-radius: 34px;
      color: #fff;
      background: var(--gray);
      font-size: 34px;
      font-weight: 900;
    }

    .segment.active {
      background: #12aeb8;
      box-shadow: 0 0 20px rgba(69, 244, 255, .48);
    }

    .manage-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
      width: 620px;
      margin: 0 auto;
    }

    .manage-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .manage-slot {
      height: 70px;
      color: #fff;
      background: rgba(5, 54, 105, .76);
      border: 3px solid var(--cyan);
      border-radius: 12px;
      box-shadow: 0 0 14px rgba(69, 244, 255, .52), inset 0 0 18px rgba(69, 244, 255, .18);
      font-size: 26px;
      font-weight: 900;
    }

    .manage-slot.free {
      background: rgba(132, 139, 145, .72);
    }

    .mini-reg {
      height: 50px;
      padding: 0 14px;
      border: 2px solid var(--cyan);
      border-radius: 10px;
      color: var(--cyan);
      background: rgba(5, 31, 77, .78);
      font-size: 20px;
      font-weight: 900;
      white-space: nowrap;
    }

    .mini-reg:disabled {
      opacity: .5;
      cursor: default;
    }

    .reg-form {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: rgba(2, 12, 30, .72);
    }

    .reg-form > div {
      width: 520px;
      padding: 32px 40px 28px;
      border: 2px solid rgba(126, 240, 255, .72);
      border-radius: 20px;
      background: rgba(3, 33, 75, .94);
      text-align: center;
    }

    .reg-form.hidden {
      display: none;
    }

    .reg-face-state {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 20px;
      color: var(--cyan);
    }

    .reg-field {
      margin-bottom: 18px;
    }

    .manage-title {
      margin: 0;
      text-align: center;
      font-size: 40px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 0 rgba(2, 12, 31, .9), 0 0 18px rgba(69, 244, 255, .34);
    }

    .card-title {
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      color: var(--cyan);
      margin-bottom: 16px;
      text-shadow: 0 0 12px rgba(69, 244, 255, .4);
    }

    .emp-table-card {
      margin-top: 20px;
      padding: 18px 20px;
      border-radius: 12px;
      height: 465px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .emp-table-wrap {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(69, 244, 255, .3) transparent;
    }

    .emp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 20px;
      font-weight: 800;
    }

    .emp-table thead {
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .emp-table th {
      background: rgba(3, 47, 99, .95);
      color: #fff;
      padding: 12px 8px;
      text-align: left;
      font-size: 20px;
      font-weight: 900;
      border-bottom: 2px solid rgba(69, 244, 255, .4);
      white-space: nowrap;
    }

    .emp-table th:first-child { padding-left: 14px; }
    .emp-table th:last-child { padding-right: 14px; }

    .emp-table td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(69, 244, 255, .12);
      color: #dff9ff;
      white-space: nowrap;
    }

    .emp-table td:first-child { padding-left: 14px; }
    .emp-table td:last-child { padding-right: 14px; }

    .emp-table tr {
      cursor: pointer;
      transition: background .15s;
    }

    .emp-table tr:hover {
      background: rgba(69, 244, 255, .1);
    }

    .emp-table tr.selected {
      background: rgba(69, 244, 255, .18);
      outline: 1px solid var(--cyan);
    }

    .detail-card {
      margin-top: 20px;
      padding: 20px 24px;
      border-radius: 12px;
    }

    .detail-body {
      display: flex;
      gap: 32px;
      height: calc(100% - 32px);
    }

    .bio-area {
      width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .bio-area span {
      font-size: 18px;
      font-weight: 900;
      color: rgba(223, 249, 255, .9);
    }

    .face-ring-large {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid rgba(69, 244, 255, .7);
      background: radial-gradient(circle, rgba(69, 244, 255, .1), rgba(3, 33, 78, .6));
      box-shadow: inset 0 0 20px rgba(69, 244, 255, .2), 0 0 20px rgba(69, 244, 255, .3);
    }

    .fingerprint-area {
      width: 110px;
      height: 90px;
      border: 2px solid rgba(69, 244, 255, .6);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 42%, rgba(69, 244, 255, .15) 0%, transparent 50%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 4px,
          rgba(69, 244, 255, .08) 4px,
          rgba(69, 244, 255, .08) 6px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 4px,
          rgba(69, 244, 255, .08) 4px,
          rgba(69, 244, 255, .08) 6px
        );
      box-shadow: inset 0 0 14px rgba(69, 244, 255, .15), 0 0 14px rgba(69, 244, 255, .2);
      position: relative;
      display: grid;
      place-items: center;
    }

    .fingerprint-area::before {
      content: "";
      width: 50px;
      height: 60px;
      border: 3px solid rgba(69, 244, 255, .5);
      border-radius: 50% 50% 40% 40%;
      box-shadow:
        inset 0 0 0 6px rgba(69, 244, 255, .1),
        0 0 8px rgba(69, 244, 255, .15);
    }

    .info-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      justify-content: center;
    }

    .detail-row {
      display: flex;
      align-items: center;
      font-size: 24px;
      font-weight: 900;
      border-bottom: 1px solid rgba(69, 244, 255, .2);
      padding: 2px 0;
    }

    .detail-row span:first-child {
      width: 140px;
      color: rgba(223, 249, 255, .8);
      flex-shrink: 0;
    }

    .detail-row .detail-val {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--cyan);
      text-decoration-thickness: 2px;
    }

    .action-bar {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      display: flex;
      gap: 24px;
      justify-content: center;
    }

    .action-btn {
      width: 110px;
      height: 110px;
      border: 2px solid var(--cyan);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(202, 244, 255, .3), rgba(13, 61, 105, .7) 47%, rgba(40, 157, 213, .18) 48%, rgba(5, 31, 76, .85));
      box-shadow: 0 0 0 2px rgba(69, 244, 255, .12), inset 0 0 10px rgba(69, 244, 255, .3), 0 0 10px rgba(69, 244, 255, .5);
      font-size: 15px;
      font-weight: 900;
      color: #fff;
      transition: transform .12s;
    }

    .action-btn:active {
      transform: scale(.96);
    }

    .action-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
    }

    .action-icon svg {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 0 6px rgba(189, 251, 255, .5));
    }

    .face-capture-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      background: rgba(2, 12, 30, .78);
    }

    .face-capture-overlay.hidden {
      display: none;
    }

    .face-capture-modal {
      width: 640px;
      padding: 40px 48px 36px;
      border: 2px solid rgba(126, 240, 255, .72);
      border-radius: 20px;
      background: rgba(3, 33, 75, .95);
      text-align: center;
    }

    .fc-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--cyan);
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(69, 244, 255, .4);
    }

    .fc-target {
      font-size: 24px;
      font-weight: 800;
      color: rgba(223, 249, 255, .9);
      margin-bottom: 28px;
    }

    .fc-target strong {
      color: #fff;
    }

    .fc-camera {
      position: relative;
      width: 400px;
      height: 400px;
      margin: 0 auto 28px;
      border-radius: 50%;
      border: 4px solid rgba(189, 251, 255, .5);
      box-shadow: 0 0 40px rgba(69, 244, 255, .3);
      background: radial-gradient(circle, rgba(69, 244, 255, .06), rgba(3, 33, 78, .5));
      display: grid;
      place-items: center;
      animation: fcPulse .8s ease-in-out infinite alternate;
    }

    .fc-icon {
      width: 200px;
      height: 200px;
    }

    .fc-actions {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 24px;
    }

    .fc-actions .neon-button {
      height: 68px;
      font-size: 28px;
      padding: 0 36px;
      min-width: 120px;
    }

    .sb-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      padding: 18px 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(126, 240, 255, .3);
      border-radius: 10px;
      background: rgba(0, 24, 58, .2);
      max-height: 360px;
      overflow-y: auto;
    }

    .sb-grid .sb-slot-layer {
      grid-column: 1 / -1;
      font-size: 16px;
      font-weight: 900;
      color: rgba(69, 244, 255, .6);
      text-align: left;
      padding: 4px 0 2px;
      border-bottom: 1px solid rgba(69, 244, 255, .15);
      margin-top: 8px;
    }

    .sb-grid .sb-slot-layer:first-child {
      margin-top: 0;
    }

    .sb-slot {
      position: relative;
      height: 100px;
      border-radius: 7px;
      border: 2px solid rgba(245, 251, 255, .72);
      background:
        linear-gradient(#05101e, #05101e) 50% 52px / 15px 32px no-repeat,
        linear-gradient(145deg, #e8f3fb, #758696);
      box-shadow: inset 0 0 12px rgba(255, 255, 255, .45), 0 3px 8px rgba(0, 0, 0, .35);
      cursor: pointer;
      transition: all .15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .sb-slot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 28px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #05101e;
      transform: translateX(-50%);
      box-shadow: 0 0 0 7px rgba(221, 234, 242, .72);
    }

    .sb-slot::after {
      content: attr(data-num);
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.85);
      pointer-events: none;
    }

    .sb-slot:active {
      transform: scale(.95);
    }

    .sb-slot.free {
      background:
        linear-gradient(#05101e, #05101e) 50% 52px / 15px 32px no-repeat,
        linear-gradient(145deg, #b8d8ff, #3d7eb8);
      border-color: #6bb5ff;
      box-shadow: inset 0 0 14px rgba(255, 255, 255, .5), 0 0 18px rgba(69, 150, 255, .6);
    }

    .sb-slot.free::before {
      box-shadow: 0 0 0 7px rgba(107, 181, 255, .7);
    }

    .sb-slot.selected {
      box-shadow: inset 0 0 16px rgba(255, 255, 255, .6), 0 0 25px rgba(69, 244, 255, .9), 0 0 50px rgba(69, 244, 255, .4);
    }

    .sb-slot.selected::before {
      box-shadow: 0 0 0 7px rgba(69, 244, 255, .8);
    }

    .sb-slot.occupied {
      border-color: rgba(245, 251, 255, .35);
      opacity: .5;
      cursor: not-allowed;
    }

    .sb-slot.mine {
      background:
        linear-gradient(#05101e, #05101e) 50% 52px / 15px 32px no-repeat,
        linear-gradient(145deg, #dbfff2, #57d496);
      border-color: #c7ffe8;
      box-shadow: inset 0 0 14px rgba(255, 255, 255, .6), 0 0 22px rgba(35, 209, 127, .78);
      cursor: not-allowed;
    }

    .sb-slot.mine::before {
      box-shadow: 0 0 0 7px rgba(35, 209, 127, .7);
    }
    .fp-sensor {
      width: 160px;
      height: 200px;
      border: 3px solid rgba(69, 244, 255, .5);
      border-radius: 12px;
      background: radial-gradient(circle at 50% 40%, rgba(69, 244, 255, .08), rgba(3, 33, 78, .7));
      box-shadow: inset 0 0 20px rgba(69, 244, 255, .12), 0 0 20px rgba(69, 244, 255, .2);
      display: grid;
      place-items: center;
      transition: all .3s;
    }

    .fc-camera.scanning .fp-sensor {
      border-color: var(--cyan);
      box-shadow: inset 0 0 30px rgba(69, 244, 255, .25), 0 0 30px rgba(69, 244, 255, .4);
      animation: fpPulse .8s ease-in-out infinite alternate;
    }

    @keyframes fpPulse {
      from { transform: scale(1); opacity: .8; }
      to { transform: scale(1.06); opacity: 1; }
    }

    .back-button {
      position: absolute;
      left: 38px;
      top: 42px;
      z-index: 10;
      width: 58px;
      height: 58px;
      border: 2px solid rgba(69, 244, 255, .8);
      border-radius: 50%;
      background: rgba(5, 46, 100, .72);
      box-shadow: 0 0 14px rgba(69, 244, 255, .32);
    }

    .back-button::before {
      content: "";
      position: absolute;
      left: 22px;
      top: 17px;
      width: 18px;
      height: 18px;
      border-left: 5px solid #dffcff;
      border-bottom: 5px solid #dffcff;
      transform: rotate(45deg);
    }

    .sync-button {
      position: absolute;
      right: 38px;
      top: 42px;
      z-index: 10;
      width: 58px;
      height: 58px;
      border: 2px solid rgba(69, 244, 255, .8);
      border-radius: 50%;
      background: rgba(5, 46, 100, .72);
      box-shadow: 0 0 14px rgba(69, 244, 255, .32);
      color: var(--cyan);
      font-size: 18px;
      font-weight: 900;
      display: grid;
      place-items: center;
    }

    @keyframes syncSpin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 9999;
      transform: translate(-50%, -50%);
      padding: 18px 36px;
      border: 2px solid var(--green);
      border-radius: 14px;
      background: rgba(3, 33, 75, .95);
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 0 40px rgba(35, 209, 127, .4);
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s;
    }

    .toast.show {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }

  </style>
</head>

  <script>

    const state = {
      mode: "retrieve",
      currentScreen: "homeScreen",
      selectedSlot: { layer: 1, numb: 1 },
      selectedPerson: null,
      currentPerson: null,
      slots: [],
      personnel: [],
      deviceList: []
    };
    for (let layer = 1; layer <= 12; layer++) {
      for (let numb = 1; numb <= 5; numb++) {
        state.slots.push({ layer, numb, uid: "", policeNos: [], disconnected: true, occupied: false });
      }
    }

    const screens = ["homeScreen", "authScreen", "certificateScreen", "loginScreen", "manageScreen"];
    const navHistory = [];
    const kioskFrame = document.getElementById("kioskFrame");
    const kiosk = document.getElementById("kiosk");


    function scaleKiosk() {
      const scale = Math.min(window.innerWidth / 800, window.innerHeight / 1280, 1);
      kioskFrame.style.width = `${800 * scale}px`;
      kioskFrame.style.height = `${1280 * scale}px`;
      kiosk.style.transform = `scale(${scale})`;
    }

    function showScreen(screenId, recordNav = true) {
      logBridge("showScreen", { from: state.currentScreen, to: screenId, recordNav: recordNav });
      if (recordNav && state.currentScreen !== screenId) {
        navHistory.push(state.currentScreen);
      }
      if (screenId !== "certificateScreen") _stopRetrievePoll();
      state.currentScreen = screenId;
      screens.forEach((id) => document.getElementById(id).classList.toggle("active", id === screenId));
    }

    function goBack() {
      let prev = navHistory.pop();
      while (prev === "authScreen") prev = navHistory.pop();
      if (prev && screens.includes(prev)) {
        showScreen(prev, false);
      }
    }

    function startAuth(mode) {
      state.mode = mode;
      showScreen("authScreen");
      document.getElementById("authState").textContent = "正在核验身份...";
      doFaceDetect("");
    }

    function renderCertificate(mode) {
      const isStore = mode === "store";
      state.selectedSlot = null;
      var p = state.currentPerson;
      var pno = p ? (p.plsNoUnique || p.policeNo || p.idNoUnique || "") : "";
      var pname = p ? (p.name || p.userName || "") : "";
      document.getElementById("policeNo").textContent = pno;
      document.getElementById("certNo").textContent = "CERT-2026-" + (pno || "066661");
      document.getElementById("slotPos").textContent = "";
      document.getElementById("sideStatus").textContent = "";
      document.getElementById("primaryAction").style.display = "";
      document.getElementById("primaryAction").textContent = isStore ? "确认存放" : "开锁";
      document.querySelector("#certificateScreen .back-button").style.display = "none";
      document.getElementById("bottomTip").textContent = isStore ? "请选择锁孔存放证书" : "请选择锁孔";
      const firstOp = renderSlotGrid(mode);
      if (firstOp) selectSlot(firstOp.slot, firstOp.button);
    }

    function renderSlotGrid(mode) {
      const panel = document.getElementById("slotPanel");
      panel.replaceChildren();
      const policeNo = document.getElementById("policeNo").textContent;
      const layers = [...new Set(state.slots.map(s => s.layer))];
      let firstOperable = null;
      layers.filter(l => state.slots.some(s => s.layer === l && !s.disconnected)).forEach(layer => {
        const slots = state.slots.filter(s => s.layer === layer && !s.disconnected);
        if (!slots.length) return;
        const row = document.createElement("div");
        row.className = "slot-row";
        slots.forEach(slot => {
          const button = document.createElement("button");
          button.className = "lock-slot";
          button.type = "button";
          button.dataset.num = (layer - 1) * 5 + slot.numb;
          button.setAttribute("aria-label", `第${slot.layer}层第${slot.numb}号锁孔`);
          if (slot.policeNos && slot.policeNos.includes(policeNo)) {
            button.classList.add(slot.occupied ? "active" : "free");
            button.addEventListener("click", (e) => selectSlot(slot, button));
            if (!firstOperable) firstOperable = { slot, button };
          }
          row.appendChild(button);
        });
        panel.appendChild(row);
      });
      return firstOperable;
    }

    function refreshSlotGrid() {
      var prevSlot = state.selectedSlot;
      var firstOp = renderSlotGrid(state.mode);
      if (prevSlot) {
        var btn = document.querySelector('.lock-slot[data-num="' + ((prevSlot.layer - 1) * 5 + prevSlot.numb) + '"]');
        if (btn) { selectSlot(prevSlot, btn); return; }
      }
      if (firstOp) selectSlot(firstOp.slot, firstOp.button);
    }

    function selectSlot(slot, btn) {
      state.selectedSlot = slot;
      document.querySelectorAll(".lock-slot.target").forEach(el => el.classList.remove("target"));
      if (btn) btn.classList.add("target");
      document.getElementById("slotPos").textContent = `第${slot.layer}排第${slot.numb}号`;
      const occupied = slot.occupied;
      document.getElementById("sideStatus").textContent = occupied ? "在用" : "空闲";
      document.getElementById("primaryAction").disabled = state.mode === "retrieve" ? !occupied : occupied;
    }



    function renderManageList(personnel) {
      const list = personnel || state.personnel;
      state.personnel = list;
      const tbody = document.getElementById("empTableBody");
      tbody.replaceChildren();
      list.forEach((p, index) => {
        const tr = document.createElement("tr");
        if (index === 0) tr.classList.add("selected");
        tr.innerHTML =
          `<td>${p.plsNoUnique || p.policeNo || p.idNoUnique || ""}</td>` +
          `<td>${p.userName || p.name || ""}</td>` +
          `<td>${p.postName || p.post || ""}</td>` +
          `<td>${p.deptName || p.dept || ""}</td>` +
          `<td>${p.mobileNo || p.phone || ""}</td>`;
        tr.addEventListener("click", () => {
          document.querySelectorAll("#empTableBody tr.selected").forEach(el => el.classList.remove("selected"));
          tr.classList.add("selected");
          state.selectedPerson = p;
          renderDetail(p);
        });
        tbody.appendChild(tr);
      });
      if (list.length > 0) {
        state.selectedPerson = list[0];
        renderDetail(list[0]);
      }
    }

    function renderDetail(p) {
      document.getElementById("dPoliceNo").textContent = p.plsNoUnique || p.policeNo || p.idNoUnique || "";
      document.getElementById("dName").textContent = p.userName || p.name || "";
      document.getElementById("dPost").textContent = p.postName || p.post || "";
      document.getElementById("dDept").textContent = p.deptName || p.dept || "";
      document.getElementById("dPhone").textContent = p.mobileNo || p.phone || "";
      const idNo = p.plsNoUnique || p.policeNo || p.idNoUnique || "";
      var slots = state.slots.filter(s => s.policeNos && s.policeNos.includes(idNo));
      document.getElementById("dSlot").textContent = slots.length
        ? slots.map(s => `第${s.layer}排${s.numb}号`).join("、")
        : "未分配";
      var faceImg = document.getElementById("dFaceImage");
      if (p.faceBase64_image) {
        faceImg.src = "data:image/png;base64," + p.faceBase64_image;
        faceImg.style.display = "block";
      } else {
        faceImg.style.display = "none";
        faceImg.removeAttribute("src");
      }
    }

    function doMgrLoginCallback(jsonObj) {
      logBridge("doMgrLoginCallback", jsonObj);
      if (jsonObj.code == 0) {
        _loginPending = 2;
        doQueryUserPoList();
        doQueryDevicePoList();
      } else {
        showToast("登录失败：" + (jsonObj.msg || "用户名或密码错误"));
      }
    }

    function doUpdateDevicePoBindNoBySlotNoUniqueCallback(jsonObj) {
      logBridge("doUpdateDevicePoBindNoBySlotNoUniqueCallback", jsonObj);
      if (jsonObj.code == 0) {
        if (jsonObj.devicePoListJsonStr) {
          var list = typeof jsonObj.devicePoListJsonStr === "string"
            ? JSON.parse(jsonObj.devicePoListJsonStr)
            : jsonObj.devicePoListJsonStr;
          list.forEach(function (d) {
            var parts = d.slotNoUnique ? d.slotNoUnique.split("_") : [];
            if (parts.length !== 2) return;
            var layer = parseInt(parts[0], 10);
            var numb = parseInt(parts[1], 10);
            var slot = state.slots.find(function (s) { return s.layer === layer && s.numb === numb; });
            if (!slot) return;
            slot.disconnected = d.status === "1" || d.status === "2" || d.useStatus === "2";
            slot.occupied = d.useStatus === "1";
            if (d.bindNo && d.bindNo !== "") {
              if (!slot.policeNos.includes(d.bindNo)) slot.policeNos.push(d.bindNo);
            } else {
              slot.policeNos = [];
            }
            slot.uid = d.uid || "";
            var dev = state.deviceList.find(function (x) { return x.slotNoUnique === d.slotNoUnique; });
            if (dev) {
              dev.bindNo = d.bindNo || "";
              dev.useStatus = d.useStatus || "0";
              dev.status = d.status || "0";
              dev.uid = d.uid || "";
            }
          });
        }
        if (state.currentScreen === "manageScreen" && state.selectedPerson) {
          renderDetail(state.selectedPerson);
        }
        var overlay = document.getElementById("slotBindOverlay");
        if (!overlay.classList.contains("hidden")) {
          openSlotBind();
        }
        showToast((_lastBindAction || "操作") + "成功");
      } else {
        showToast("绑定/解绑失败：" + (jsonObj.msg || ""));
      }
    }

    function getLockStCallback(jsonObj) {
      logBridge("getLockStCallback", { lockSt: jsonObj.lockSt, mode: state.mode, screen: state.currentScreen });
      if (state.mode === "retrieve" && state.currentScreen === "certificateScreen" && jsonObj.lockSt == 1) {
        logBridge("getLockStCallback matched, going home");
        _stopRetrievePoll();
        showScreen("homeScreen", false);
      }
    }

    function openLockCallback(jsonObj) {
      logBridge("openLockCallback", jsonObj);
      if (jsonObj.code == 0) {
        renderCertificate(state.mode);
        showScreen("certificateScreen");
      } else {
        document.getElementById("authState").textContent = "开锁失败：" + (jsonObj.msg || "柜门异常");
      }
    }



    var _retrievePollTimer = null;

    function openMotorLockCallback(jsonObj) {
      const success = jsonObj.code == 0;
      if (success && state.selectedSlot) {
        if (state.mode === "retrieve") {
          state.selectedSlot.occupied = false;
          document.getElementById("sideStatus").textContent = "空闲";
          var btn = document.querySelector('.lock-slot[data-num="' + ((state.selectedSlot.layer - 1) * 5 + state.selectedSlot.numb) + '"]');
          if (btn) { btn.classList.remove("active"); btn.classList.add("free"); }
          _startRetrievePoll();
          document.getElementById("bottomTip").textContent = "开锁成功，请取出证书";
        } else {
          state.selectedSlot.occupied = true;
          document.getElementById("sideStatus").textContent = "在用";
          var btn = document.querySelector('.lock-slot[data-num="' + ((state.selectedSlot.layer - 1) * 5 + state.selectedSlot.numb) + '"]');
          if (btn) { btn.classList.remove("free"); btn.classList.add("active"); }
          document.getElementById("bottomTip").textContent = "存放成功，请关闭柜门";
        }
      } else {
        document.getElementById("bottomTip").textContent = "开锁失败：" + (jsonObj.msg || "电机锁异常");
      }
    }

    function _startRetrievePoll() {
      _stopRetrievePoll();
      _retrievePollTimer = setInterval(function () {
        invokeAndroid({ action: "getLockSt" });
      }, 2000);
    }

    function _stopRetrievePoll() {
      if (_retrievePollTimer) { clearInterval(_retrievePollTimer); _retrievePollTimer = null; }
    }

    function doQueryUserPoListCallback(jsonObj) {
      logBridge("doQueryUserPoListCallback", jsonObj);
      if (jsonObj.code == 0 && jsonObj.userPoListJsonStr) {
        try {
          const list = typeof jsonObj.userPoListJsonStr === "string"
            ? JSON.parse(jsonObj.userPoListJsonStr)
            : jsonObj.userPoListJsonStr;
          state.personnel = list;
          if (state.currentScreen === "manageScreen") {
            renderManageList(list);
          }
        } catch (e) {
          logBridge("doQueryUserPoListCallback parse error", e);
        }
      }
      _syncDone();
    }

    function doQueryDevicePoListCallback(jsonObj) {
      logBridge("doQueryDevicePoListCallback", jsonObj);
      if (jsonObj.code == 0 && jsonObj.devicePoListJsonStr) {
        updateDeviceList(jsonObj.devicePoListJsonStr);
        if (state.currentScreen === "certificateScreen") {
          refreshSlotGrid();
        }
      }
      _syncDone();
      if (_authDevicePending) {
        _authDevicePending = false;
        if (jsonObj.code == 0) {
          openLock();
        } else {
          document.getElementById("authState").textContent = "获取设备信息失败，请重试";
        }
      }
    }

    function termFaceCallback(jsonObj) {
      logBridge("termFaceCallback", jsonObj);
      if (jsonObj.code == 0) {
        if (jsonObj.action === "doFaceDetect") {
          var idNo = jsonObj.idNoUnique || "";
          document.getElementById("authState").textContent = "人脸识别通过，已开柜门";
          if (idNo) {
            var person = state.personnel.find(function (p) {
              return (p.plsNoUnique || p.policeNo || p.idNoUnique) === idNo;
            });
            state.currentPerson = person || { plsNoUnique: idNo, idNoUnique: idNo };
            document.getElementById("policeNo").textContent = idNo;
          }
          _authDevicePending = true;
          doQueryDevicePoList();
        } else if (jsonObj.action === "doFaceCollect") {
          showToast("采集成功");
          closeFaceCapture();
          doQueryUserPoList();
        }
      } else {
        if (jsonObj.action === "doFaceDetect") {
          document.getElementById("authState").textContent = "人脸识别失败：" + (jsonObj.msg || "");
          setTimeout(function () { showScreen("homeScreen"); }, 1500);
        } else if (jsonObj.action === "doFaceCollect") {
          showToast("采集失败：" + (jsonObj.msg || ""));
        }
      }
    }

    function updateDeviceList(devicePoListJsonStr) {
      try {
        const list = typeof devicePoListJsonStr === "string"
          ? JSON.parse(devicePoListJsonStr)
          : devicePoListJsonStr;
        state.deviceList = list;
        state.slots.forEach(s => { s.policeNos = []; s.disconnected = true; s.occupied = false; });
        list.forEach(d => {
          var parts = d.slotNoUnique ? d.slotNoUnique.split("_") : [];
          if (parts.length !== 2) return;
          var layer = parseInt(parts[0], 10);
          var numb = parseInt(parts[1], 10);
          var slot = state.slots.find(s => s.layer === layer && s.numb === numb);
          if (!slot) return;
          slot.disconnected = d.status === "1" || d.status === "2" || d.useStatus === "2";
          slot.occupied = d.useStatus === "1";
          if (d.bindNo && d.bindNo !== "") {
            if (!slot.policeNos.includes(d.bindNo)) slot.policeNos.push(d.bindNo);
          }
        });
      } catch (e) {
        logBridge("updateDeviceList parse error", e);
      }
    }

    function reportTagStateCallback(jsonObj) {
      var layer = jsonObj.layer;
      var numb = jsonObj.numb;
      var uid = jsonObj.uid;
      logBridge("标签状态上报 layer:" + layer + " numb:" + numb + " uid:" + uid);
      doQueryDevicePoList();
    }

    function reportDoorLockStateCallback(jsonObj) {
      var doorLockState = jsonObj.doorLockState;
      logBridge("门锁状态上报 doorLockState:" + doorLockState);
      var closed = doorLockState === 0 || doorLockState === "0" || doorLockState === "0x00";
      if (closed && state.currentScreen === "certificateScreen") {
        _stopRetrievePoll();
        showScreen("homeScreen", false);
      }
    }

    function doConfigCallback(jsonObj) {
      logBridge("doConfigCallback", jsonObj);
    }

    function doShowCabinetDoorStatusCallback(jsonObj) {
      var cabinetDoorStatus = jsonObj.cabinetDoorStatus;
      logBridge("doShowCabinetDoorStatusCallback", { cabinetDoorStatus: cabinetDoorStatus });
      var closed = cabinetDoorStatus === "1" || cabinetDoorStatus === 1;
      if (closed && state.currentScreen === "certificateScreen") {
        _stopRetrievePoll();
        showScreen("homeScreen", false);
      }
    }

    function downImageCallback(jsonObj) {
    }

    window.getLockStCallback = getLockStCallback;
    window.openLockCallback = openLockCallback;
    window.openMotorLockCallback = openMotorLockCallback;
    window.doQueryUserPoListCallback = doQueryUserPoListCallback;
    window.doQueryDevicePoListCallback = doQueryDevicePoListCallback;
    window.termFaceCallback = termFaceCallback;
    window.doMgrLoginCallback = doMgrLoginCallback;
    window.reportTagStateCallback = reportTagStateCallback;
    window.reportDoorLockStateCallback = reportDoorLockStateCallback;
    window.doUpdateDevicePoBindNoBySlotNoUniqueCallback = doUpdateDevicePoBindNoBySlotNoUniqueCallback;
    window.doConfigCallback = doConfigCallback;
    window.doShowCabinetDoorStatusCallback = doShowCabinetDoorStatusCallback;
    window.downImageCallback = downImageCallback;

    document.querySelectorAll("[data-mode]").forEach((button) => {
      button.addEventListener("click", () => startAuth(button.dataset.mode));
    });

    document.querySelectorAll("[data-nav]").forEach((button) => {
      button.addEventListener("click", () => showScreen(button.dataset.nav));
    });

    document.getElementById("settingsButton").addEventListener("click", () => showScreen("loginScreen"));

    document.getElementById("loginButton").addEventListener("click", () => {
      var username = document.getElementById("username").value || "admin";
      var password = document.getElementById("password").value || "123456";
      doMgrLogin(username, password);
    });

    var _syncPending = 0;
    var _loginPending = 0;
    var _authDevicePending = false;
    function _syncDone() {
      if (_syncPending > 0) {
        _syncPending--;
        if (_syncPending <= 0) {
          _syncPending = 0;
          var btn = document.getElementById("syncBtn");
          btn.disabled = false;
          btn.style.animation = "none";
          showToast("数据同步完成");
        }
      }
      if (_loginPending > 0) {
        _loginPending--;
        if (_loginPending <= 0) {
          _loginPending = 0;
          renderManageList(state.personnel);
          showScreen("manageScreen");
        }
      }
    }

    document.getElementById("syncBtn").addEventListener("click", function () {
      logBridge("syncData", { msg: "正在同步数据..." });
      var btn = this;
      btn.disabled = true;
      btn.style.animation = "syncSpin .8s linear infinite";
      _syncPending = 2;
      doQueryUserPoList();
      doQueryDevicePoList();
    });

    function openFaceCapture() {
      const p = state.selectedPerson;
      if (!p) { alert("请先选择一位人员"); return; }
      document.getElementById("fcTargetName").textContent = (p.plsNoUnique || p.policeNo || p.idNoUnique || "") + " " + (p.userName || p.name || "");
      document.getElementById("faceCaptureOverlay").classList.remove("hidden");
    }

    function closeFaceCapture() {
      document.getElementById("faceCaptureOverlay").classList.add("hidden");
    }

    document.getElementById("faceCollectBtn").addEventListener("click", openFaceCapture);

    document.getElementById("fcCapture").addEventListener("click", () => {
      const p = state.selectedPerson;
      if (!p) return;
      const idNoUnique = p.idNoUnique || p.plsNoUnique || p.policeNo || "";
      doFaceCollect(idNoUnique);
    });

    document.getElementById("fcCancel").addEventListener("click", closeFaceCapture);

    let fpCaptured = false;

    function openFingerCapture() {
      const p = state.selectedPerson;
      if (!p) { alert("请先选择一位人员"); return; }
      document.getElementById("fpTargetName").textContent = (p.plsNoUnique || p.policeNo || p.idNoUnique || "") + " " + (p.userName || p.name || "");
      document.getElementById("fingerCaptureOverlay").classList.remove("hidden");
      document.getElementById("fpCamera").classList.remove("captured", "scanning");
      document.getElementById("fpSensor").classList.remove("hidden");
      document.getElementById("fpPreview").classList.add("hidden");
      document.getElementById("fpCapture").style.display = "";
      document.getElementById("fpRetake").style.display = "none";
      document.getElementById("fpConfirm").style.display = "none";
      document.getElementById("fpHint").textContent = "请将手指放在传感器上";
      fpCaptured = false;
    }

    function closeFingerCapture() {
      document.getElementById("fingerCaptureOverlay").classList.add("hidden");
    }

    document.getElementById("fingerCollectBtn").addEventListener("click", openFingerCapture);

    document.getElementById("fpCapture").addEventListener("click", () => {
      showToast("指纹采集接口暂未对接");
    });

    document.getElementById("fpRetake").addEventListener("click", () => {
      document.getElementById("fpPreview").classList.add("hidden");
      document.getElementById("fpCamera").classList.remove("captured");
      document.getElementById("fpHint").textContent = "请将手指放在传感器上";
      document.getElementById("fpCapture").style.display = "";
      document.getElementById("fpRetake").style.display = "none";
      document.getElementById("fpConfirm").style.display = "none";
      fpCaptured = false;
    });

    document.getElementById("fpConfirm").addEventListener("click", () => {
      if (!fpCaptured) return;
      const p = state.selectedPerson;
      p.fingerCaptured = true;
      logBridge("fingerCollect", { policeNo: p.policeNo, name: p.name, result: "success" });
      closeFingerCapture();
    });

    document.getElementById("fpCancel").addEventListener("click", closeFingerCapture);

    let sbSelectedSlot = null;
    let _lastBindAction = "";

    function openSlotBind() {
      const p = state.selectedPerson;
      if (!p) { alert("请先选择一位人员"); return; }
      sbSelectedSlot = null;
      const idNo = p.plsNoUnique || p.policeNo || p.idNoUnique || "";
      document.getElementById("sbTargetName").textContent = idNo + " " + (p.userName || p.name || "");
      document.getElementById("sbConfirm").disabled = true;
      document.getElementById("sbConfirm").textContent = "确认绑定";

      const grid = document.getElementById("sbGrid");
      grid.replaceChildren();
      const layers = [...new Set(state.slots.map(s => s.layer))].sort((a, b) => a - b);
      layers.forEach(layer => {
        const slots = state.slots.filter(s => s.layer === layer && s && !s.disconnected);
        if (!slots.length) return;
        const label = document.createElement("div");
        label.className = "sb-slot-layer";
        label.textContent = `第${layer}层`;
        grid.appendChild(label);
        for (let numb = 1; numb <= 5; numb++) {
          const slot = slots.find(s => s.numb === numb);
          if (!slot) continue;
          const btn = document.createElement("button");
          btn.className = "sb-slot";
          btn.dataset.num = (layer - 1) * 5 + numb;
          if (slot.policeNos && slot.policeNos.includes(idNo)) {
            btn.classList.add("mine");
            btn.addEventListener("click", () => {
              document.querySelectorAll("#sbGrid .sb-slot.selected").forEach(el => el.classList.remove("selected"));
              btn.classList.add("selected");
              sbSelectedSlot = { slot, unbind: true };
              document.getElementById("sbConfirm").disabled = false;
              document.getElementById("sbConfirm").textContent = "解绑";
            });
          } else if (slot.policeNos && slot.policeNos.length > 0) {
            btn.classList.add("occupied");
          } else {
            btn.classList.add("free");
            btn.addEventListener("click", () => {
              document.querySelectorAll("#sbGrid .sb-slot.selected").forEach(el => el.classList.remove("selected"));
              btn.classList.add("selected");
              sbSelectedSlot = { slot, unbind: false };
              document.getElementById("sbConfirm").disabled = false;
              document.getElementById("sbConfirm").textContent = "确认绑定";
            });
          }
          grid.appendChild(btn);
        }
      });

      document.getElementById("slotBindOverlay").classList.remove("hidden");
    }

    function closeSlotBind() {
      document.getElementById("slotBindOverlay").classList.add("hidden");
    }

    document.getElementById("slotBindBtn").addEventListener("click", openSlotBind);

    document.getElementById("sbConfirm").addEventListener("click", () => {
      const p = state.selectedPerson;
      if (!p || !sbSelectedSlot) return;
      const idNoUnique = p.plsNoUnique || p.policeNo || p.idNoUnique || "";
      const slot = sbSelectedSlot.slot;
      const slotNoUnique = slot.layer + "_" + slot.numb;
      const deviceJsonArrayStr = [{
        bindNo: sbSelectedSlot.unbind ? "" : idNoUnique,
        slotNoUnique: slotNoUnique
      }];
      _lastBindAction = sbSelectedSlot.unbind ? "解绑" : "绑定";
      doUpdateDevicePoBindNoBySlotNoUnique(deviceJsonArrayStr);
    });

    document.getElementById("sbCancel").addEventListener("click", closeSlotBind);

    document.getElementById("primaryAction").addEventListener("click", () => {
      const { layer, numb } = state.selectedSlot;
      openMotorLock(layer, numb);
    });

    window.addEventListener("popstate", (e) => { e.preventDefault(); goBack(); });
    window.addEventListener("keydown", (e) => {
      if ((e.key === "Escape" || e.key === "Backspace") &&
          !["INPUT", "TEXTAREA"].includes(e.target.tagName)) goBack();
    });

    scaleKiosk();
    doQueryUserPoList();
    doQueryDevicePoList();
    window.addEventListener("resize", scaleKiosk);

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2000);
    }
  </script>


</body>
</html>
