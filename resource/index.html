        gap: 14px;

      }

      .detail-row {
        display: flex;
        align-items: center;

        font-weight: 900;
        border-bottom: 1px solid rgba(69, 244, 255, 0.2);
        padding: 2px 0;
      }

      }

      .detail-row .detail-val {

        text-decoration-color: var(--cyan);
        text-decoration-thickness: 2px;
      }

      .action-bar {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 24px;
        display: flex;
        gap: 24px;
        justify-content: center;
      }

      .action-btn {
        width: 110px;
        height: 110px;
        border: 2px solid var(--cyan);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: linear-gradient(
          135deg,
          rgba(202, 244, 255, 0.3),
          rgba(13, 61, 105, 0.7) 47%,
          rgba(40, 157, 213, 0.18) 48%,
          rgba(5, 31, 76, 0.85)
        );
        box-shadow: 0 0 0 2px rgba(69, 244, 255, 0.12),
          inset 0 0 10px rgba(69, 244, 255, 0.3),
          0 0 10px rgba(69, 244, 255, 0.5);
        font-size: 15px;
        font-weight: 900;
        color: #fff;
        transition: transform 0.12s;
      }

      .action-btn:active {
        transform: scale(0.96);
      }

      .action-icon {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
      }

      .action-icon svg {
        width: 40px;
        height: 40px;
        filter: drop-shadow(0 0 6px rgba(189, 251, 255, 0.5));
      }

      .face-capture-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: rgba(2, 12, 30, 0.78);
      }

      .face-capture-overlay.hidden {
        display: none;
      }

      .face-capture-modal {
        width: 640px;
        padding: 40px 48px 36px;
        border: 2px solid rgba(126, 240, 255, 0.72);
        border-radius: 20px;
        background: rgba(3, 33, 75, 0.95);
        text-align: center;
      }

      .fc-title {
        font-size: 32px;
        font-weight: 900;
        color: var(--cyan);
        margin-bottom: 20px;
        text-shadow: 0 0 12px rgba(69, 244, 255, 0.4);
      }

      .fc-target {
        font-size: 24px;
        font-weight: 800;
        color: rgba(223, 249, 255, 0.9);
        margin-bottom: 28px;
      }

      .fc-target strong {
        color: #fff;
      }

      .fc-camera {
        position: relative;
        width: 400px;
        height: 400px;
        margin: 0 auto 28px;
        border-radius: 50%;
        border: 4px solid rgba(189, 251, 255, 0.5);
        box-shadow: 0 0 40px rgba(69, 244, 255, 0.3);
        background: radial-gradient(
          circle,
          rgba(69, 244, 255, 0.06),
          rgba(3, 33, 78, 0.5)
        );
        display: grid;
        place-items: center;
        animation: fcPulse 0.8s ease-in-out infinite alternate;
      }

      .fc-icon {
        width: 200px;
        height: 200px;
      }

      .fc-actions {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 24px;
      }

      .fc-actions .neon-button {
        height: 68px;
        font-size: 28px;
        padding: 0 36px;
        min-width: 120px;
      }

      .sb-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 14px;
        padding: 18px 14px;
        margin-bottom: 14px;
        border: 1px solid rgba(126, 240, 255, 0.3);
        border-radius: 10px;
        background: rgba(0, 24, 58, 0.2);
        max-height: 360px;
        overflow-y: auto;
      }

      .sb-grid .sb-slot-layer {
        grid-column: 1 / -1;
        font-size: 16px;
        font-weight: 900;
        color: rgba(69, 244, 255, 0.6);
        text-align: left;
        padding: 4px 0 2px;
        border-bottom: 1px solid rgba(69, 244, 255, 0.15);
        margin-top: 8px;
      }

      .sb-grid .sb-slot-layer:first-child {
        margin-top: 0;
      }

      .sb-slot {
        position: relative;
        height: 100px;
        border-radius: 7px;
        border: 2px solid rgba(245, 251, 255, 0.72);
        background: linear-gradient(#05101e, #05101e) 50% 52px / 15px 32px
            no-repeat,
          linear-gradient(145deg, #e8f3fb, #758696);
        box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.45),
          0 3px 8px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        transition: all 0.15s;
        -webkit-appearance: none;
        appearance: none;
      }

      .sb-slot::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 28px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #05101e;
        transform: translateX(-50%);
        box-shadow: 0 0 0 7px rgba(221, 234, 242, 0.72);
      }

      .sb-slot::after {
        content: attr(data-num);
        position: absolute;
        left: 50%;
        bottom: 6px;
        transform: translateX(-50%);
        font-size: 16px;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        pointer-events: none;
      }

      .sb-slot:active {
        transform: scale(0.95);
      }

      .sb-slot.free {
        background: linear-gradient(#05101e, #05101e) 50% 52px / 15px 32px
            no-repeat,
          linear-gradient(145deg, #b8d8ff, #3d7eb8);
        border-color: #6bb5ff;
        box-shadow: inset 0 0 14px rgba(255, 255, 255, 0.5),
          0 0 18px rgba(69, 150, 255, 0.6);
      }

      .sb-slot.free::before {
        box-shadow: 0 0 0 7px rgba(107, 181, 255, 0.7);
      }

      .sb-slot.selected {
        box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.6),
          0 0 25px rgba(69, 244, 255, 0.9), 0 0 50px rgba(69, 244, 255, 0.4);
      }

      .sb-slot.selected::before {
        box-shadow: 0 0 0 7px rgba(69, 244, 255, 0.8);
      }

      .sb-slot.occupied {
        border-color: rgba(245, 251, 255, 0.35);
        opacity: 0.5;
        cursor: not-allowed;
      }

      .sb-slot.mine {
        background: linear-gradient(#05101e, #05101e) 50% 52px / 15px 32px
            no-repeat,
          linear-gradient(145deg, #dbfff2, #57d496);
        border-color: #c7ffe8;
        box-shadow: inset 0 0 14px rgba(255, 255, 255, 0.6),
          0 0 22px rgba(35, 209, 127, 0.78);
        cursor: not-allowed;
      }

      .sb-slot.mine::before {
        box-shadow: 0 0 0 7px rgba(35, 209, 127, 0.7);
      }
      .fp-sensor {
        width: 160px;
        height: 200px;
        border: 3px solid rgba(69, 244, 255, 0.5);
        border-radius: 12px;
        background: radial-gradient(
          circle at 50% 40%,
          rgba(69, 244, 255, 0.08),
          rgba(3, 33, 78, 0.7)
        );
        box-shadow: inset 0 0 20px rgba(69, 244, 255, 0.12),
          0 0 20px rgba(69, 244, 255, 0.2);
        display: grid;
        place-items: center;
        transition: all 0.3s;
      }

      .fc-camera.scanning .fp-sensor {
        border-color: var(--cyan);
        box-shadow: inset 0 0 30px rgba(69, 244, 255, 0.25),
          0 0 30px rgba(69, 244, 255, 0.4);
        animation: fpPulse 0.8s ease-in-out infinite alternate;
      }

      @keyframes fpPulse {
        from {
          transform: scale(1);
          opacity: 0.8;
        }
        to {
          transform: scale(1.06);
          opacity: 1;
        }
      }

      .back-button {
        position: absolute;
        left: 38px;
        top: 42px;
        z-index: 10;
        width: 58px;
        height: 58px;
        border: 2px solid rgba(69, 244, 255, 0.8);
        border-radius: 50%;
        background: rgba(5, 46, 100, 0.72);
        box-shadow: 0 0 14px rgba(69, 244, 255, 0.32);
      }

      .back-button::before {
        content: '';
        position: absolute;
        left: 22px;
        top: 17px;
        width: 18px;
        height: 18px;
        border-left: 5px solid #dffcff;
        border-bottom: 5px solid #dffcff;
        transform: rotate(45deg);
      }

      .sync-button {
        position: absolute;
        right: 38px;
        top: 42px;
        z-index: 10;
        width: 58px;
        height: 58px;
        border: 2px solid rgba(69, 244, 255, 0.8);
        border-radius: 50%;
        background: rgba(5, 46, 100, 0.72);
        box-shadow: 0 0 14px rgba(69, 244, 255, 0.32);
        color: var(--cyan);
        font-size: 18px;
        font-weight: 900;
        display: grid;
        place-items: center;
      }

      @keyframes syncSpin {
        to {
          transform: rotate(360deg);
        }
      }

      .toast {
        position: fixed;
        left: 50%;
        top: 50%;
        z-index: 9999;
        transform: translate(-50%, -50%);
        padding: 18px 36px;
        border: 2px solid var(--green);
        border-radius: 14px;
        background: rgba(3, 33, 75, 0.95);
        color: #fff;
        font-size: 26px;
        font-weight: 900;
        text-align: center;
        box-shadow: 0 0 40px rgba(35, 209, 127, 0.4);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s;
      }

      .toast.show {
        opacity: 1;
      }

      .hidden {
        display: none !important;
      }
    </style>

                class="face-capture-modal"
                style="width: 680px; padding: 36px 44px 32px"
              >

                <div class="fc-actions">

                    class="neon-button"
                    id="sbConfirm"
                    disabled=""

                      border-color: rgba(197, 255, 255, 0.88);

    <div class="toast" id="toast"></div>

    <script>
      var vConsole = new VConsole({ maxLogNumber: 2000 })
      const state = {
        mode: 'retrieve',
        currentScreen: 'homeScreen',
        selectedSlot: { layer: 1, numb: 1 },
        selectedPerson: null,
        currentPerson: null,
        slots: [],
        personnel: [],
        deviceList: []
      }
      for (let layer = 1; layer <= 12; layer++) {
        for (let numb = 1; numb <= 5; numb++) {
          state.slots.push({
            layer,
            numb,
            uid: '',
            idNos: [],
            bindNo: '', // 存储原始 bindNo 字符串
            disconnected: true,
            occupied: false
          })
        }
      }

      const screens = [
        'homeScreen',
        'authScreen',
        'certificateScreen',
        'loginScreen',
        'manageScreen'
      ]
      const navHistory = []
      const kioskFrame = document.getElementById('kioskFrame')
      const kiosk = document.getElementById('kiosk')

      function scaleKiosk() {
        const scale = Math.min(
          window.innerWidth / 800,
          window.innerHeight / 1280,
          1
        )
        kioskFrame.style.width = `${800 * scale}px`
        kioskFrame.style.height = `${1280 * scale}px`
        kiosk.style.transform = `scale(${scale})`
      }

      function showScreen(screenId, recordNav = true) {
        logBridge('showScreen', {
          from: state.currentScreen,
          to: screenId,
          recordNav: recordNav
        })
        if (recordNav && state.currentScreen !== screenId) {
          navHistory.push(state.currentScreen)
        }
        state.currentScreen = screenId
        screens.forEach(id =>
          document
            .getElementById(id)
            .classList.toggle('active', id === screenId)
        )
      }

      function goBack() {
        let prev = navHistory.pop()
        while (prev === 'authScreen') prev = navHistory.pop()
        if (prev && screens.includes(prev)) {
          showScreen(prev, false)
        }
      }

      function startAuth(mode) {
        state.mode = mode
        showScreen('authScreen')
        document.getElementById('authState').textContent = '正在核验身份...'
        var authImg = document.getElementById('authFaceImage')
        if (authImg) {
          authImg.style.display = 'none'
          authImg.removeAttribute('src')
        }
        var operateType = mode === 'store' ? '0' : '1'
        doFaceDetect(operateType)
      }

      function parseSlotPositions(slotPositions) {
        const keys = new Set()
        if (!slotPositions) return keys
        String(slotPositions)
          .split(/[,，;；\s]+/)
          .forEach(function (part) {
            part = (part || '').trim()
            if (!part) return
            const m = part.match(/^(\d+)[_\-.xX](\d+)$/)
            if (m) keys.add(m[1] + '_' + m[2])
          })
        return keys
      }

      function renderCertificate(mode) {
        logBridge(
          'renderCertificate 被调用，模式:',
          mode,
          '当前用户:',
          state.currentPerson
        )
        const isStore = mode === 'store'
        state.selectedSlot = null
        var p = state.currentPerson
        var pno = p ? p.idNoUnique || '' : ''
        var pname = p ? p.name || p.userName || '' : ''
        var allowedKeys = parseSlotPositions(p ? p.slotPositions : '')
        logBridge(
          'renderCertificate - 用户身份证号:',
          pno,
          '用户名:',
          pname,
          '可用锁孔 slotPositions:',
          p ? p.slotPositions : '',
          allowedKeys
        )
        document.getElementById('idNo').textContent = pname
        var plsNo = p ? p.plsNoUnique || '' : ''
        document.getElementById('certNo').textContent = plsNo
        document.getElementById('certNoRow').style.display = plsNo
          ? ''
          : 'none'
        document.getElementById('slotPos').textContent = ''
        document.getElementById('sideStatus').textContent = ''
        document.getElementById('primaryAction').style.display = ''
        document.getElementById('primaryAction').textContent = isStore
          ? '确认存放'
          : '开锁'
        document.getElementById('bottomTip').textContent = isStore
          ? '请选择锁孔存放证书'
          : '请选择锁孔'
        if (allowedKeys.size === 0) {
          logBridge('renderCertificate - 当前用户未分配可用锁孔 slotPositions')
        }
        // 根据 slotPositions 计算当前用户可用的锁孔
        var matchedSlots = state.slots
          .filter(function (s) {
            return allowedKeys.has(s.layer + '_' + s.numb)
          })
          .map(function (s) {
            return {
              layer: s.layer,
              numb: s.numb,
              occupied: s.occupied,
              disconnected: s.disconnected,
              uid: s.uid
            }
          })
        logBridge('renderCertificate 当前用户', {
          mode: mode,
          idNo: pno,
          name: pname,
          currentPerson: p,
          slotPositions: p ? p.slotPositions : '',
          matchedSlots: matchedSlots
        })
        const firstOp = renderSlotGrid(mode)
        if (firstOp) selectSlot(firstOp.slot, firstOp.button)
      }

      function renderSlotGrid(mode) {
        const panel = document.getElementById('slotPanel')
        panel.replaceChildren()
        const idNo = document.getElementById('idNo').textContent
        const currentPersonIdNo = state.currentPerson
          ? state.currentPerson.idNoUnique
          : ''
        const allowedKeys = parseSlotPositions(
          state.currentPerson ? state.currentPerson.slotPositions : ''
        )
        logBridge(
          'renderSlotGrid - DOM身份证号:',
          idNo,
          'state.currentPerson.idNoUnique:',
          currentPersonIdNo,
          '可用锁孔 slotPositions:',
          state.currentPerson ? state.currentPerson.slotPositions : '',
          allowedKeys,
          '状态.currentScreen:',
          state.currentScreen,
          '模式:',
          mode
        )
        logBridge(
          'renderSlotGrid - state.slots 数量:',
          state.slots ? state.slots.length : 0
        )

        // 输出前几个锁孔信息
        if (state.slots && state.slots.length > 0) {
          state.slots.slice(0, 5).forEach((slot, i) => {
            const idNos = slot.idNos || []
            const bindNo = slot.bindNo || ''
            const allowed = allowedKeys.has(slot.layer + '_' + slot.numb)
            logBridge(
              `  锁孔${i + 1}: layer=${slot.layer}, numb=${
                slot.numb
              }, occupied=${
                slot.occupied
              }, bindNo="${bindNo}", idNos=${JSON.stringify(idNos)}`
            )
            logBridge(`  匹配检查: idNo=${idNo}, slotPositions允许=${allowed}`)
          })
        }

        const layers = [...new Set(state.slots.map(s => s.layer))]
        let firstOperable = null
        const slotDebug = []
        layers
          .filter(l => state.slots.some(s => s.layer === l && !s.disconnected))
          .forEach(layer => {
            const slots = state.slots.filter(
              s => s.layer === layer && !s.disconnected
            )
            if (!slots.length) return
            const row = document.createElement('div')
            row.className = 'slot-row'
            slots.forEach(slot => {
              // 是否可用由当前用户的 slotPositions 决定
              const mine = allowedKeys.has(slot.layer + '_' + slot.numb)
              slotDebug.push({
                slot: slot.layer + '_' + slot.numb,
                mine: !!mine,
                allowed: mine,
                occupied: slot.occupied,
                disconnected: slot.disconnected,
                bindNo: slot.bindNo || '',
                bindNos: (slot.idNos || []).join(','),
                currentIdNo: idNo
              })
              const button = document.createElement('button')
              button.className = 'lock-slot'
              button.type = 'button'
              button.dataset.num = (layer - 1) * 5 + slot.numb
              button.setAttribute(
                'aria-label',
                `第${slot.layer}层第${slot.numb}号锁孔`
              )
              if (mine) {
                button.classList.add(slot.occupied ? 'active' : 'free')
                button.addEventListener('click', e => selectSlot(slot, button))
                if (!firstOperable) firstOperable = { slot, button }
              }
              row.appendChild(button)
            })
            panel.appendChild(row)
          })
        logBridge('renderSlotGrid 锁孔匹配明细', slotDebug)
        logBridge(
          'renderSlotGrid 找到的可操作孔:',
          firstOperable
            ? `layer=${firstOperable.slot.layer}, numb=${firstOperable.slot.numb}`
            : '无'
        )
        return firstOperable
      }

      function refreshSlotGrid() {
        var prevSlot = state.selectedSlot
        var firstOp = renderSlotGrid(state.mode)
        if (prevSlot) {
          var btn = document.querySelector(
            '.lock-slot[data-num="' +
              ((prevSlot.layer - 1) * 5 + prevSlot.numb) +
              '"]'
          )
          if (btn) {
            selectSlot(prevSlot, btn)
            return
          }
        }
        if (firstOp) selectSlot(firstOp.slot, firstOp.button)
      }

      function selectSlot(slot, btn) {
        state.selectedSlot = slot
        document
          .querySelectorAll('.lock-slot.target')
          .forEach(el => el.classList.remove('target'))
        if (btn) btn.classList.add('target')
        document.getElementById(
          'slotPos'
        ).textContent = `第${slot.layer}排第${slot.numb}号`
        const occupied = slot.occupied
        document.getElementById('sideStatus').textContent = occupied
          ? '在用'
          : '空闲'
        document.getElementById('primaryAction').disabled =
          state.mode === 'retrieve' ? !occupied : occupied
      }

      function renderManageList(personnel) {
        const list = personnel || state.personnel
        state.personnel = list
        const tbody = document.getElementById('empTableBody')
        tbody.replaceChildren()

        let selectedIndex = 0
        if (state.selectedPerson && state.selectedPerson.idNoUnique) {
          const foundIdx = list.findIndex(
            p => p.idNoUnique === state.selectedPerson.idNoUnique
          )
          if (foundIdx !== -1) {
            selectedIndex = foundIdx
          }
        }

        list.forEach((p, index) => {
          const tr = document.createElement('tr')
          if (index === selectedIndex) tr.classList.add('selected')
          tr.innerHTML =
            `<td>${p.idNoUnique || ''}</td>` +
            `<td>${p.userName || p.name || ''}</td>` +
            `<td>${p.postName || p.post || ''}</td>` +
            `<td>${p.deptName || p.dept || ''}</td>` +
            `<td>${p.mobileNo || p.phone || ''}</td>`
          tr.addEventListener('click', () => {
            document
              .querySelectorAll('#empTableBody tr.selected')
              .forEach(el => el.classList.remove('selected'))
            tr.classList.add('selected')
            state.selectedPerson = p
            renderDetail(p)
          })
          tbody.appendChild(tr)
        })
        if (list.length > 0) {
          state.selectedPerson = list[selectedIndex]
          renderDetail(list[selectedIndex])
        } else {
          state.selectedPerson = null
          renderDetail(null)
        }
      }

      function renderDetail(p) {
        if (!p) {
          document.getElementById('dIdNo').textContent = ''
          document.getElementById('dName').textContent = ''
          document.getElementById('dPost').textContent = ''
          document.getElementById('dDept').textContent = ''
          document.getElementById('dPhone').textContent = ''
          document.getElementById('dSlot').textContent = ''
          var faceImg = document.getElementById('dFaceImage')
          if (faceImg) {
            faceImg.style.display = 'none'
            faceImg.removeAttribute('src')
          }
          return
        }
        document.getElementById('dIdNo').textContent = p.idNoUnique || ''
        document.getElementById('dName').textContent =
          p.userName || p.name || ''
        document.getElementById('dPost').textContent =
          p.postName || p.post || ''
        document.getElementById('dDept').textContent =
          p.deptName || p.dept || ''
        document.getElementById('dPhone').textContent =
          p.mobileNo || p.phone || ''
        var slotKeys = parseSlotPositions(p.slotPositions)
        document.getElementById('dSlot').textContent = slotKeys.size
          ? Array.from(slotKeys)
              .map(function (k) {
                var parts = k.split('_')
                return '第' + parts[0] + '排第' + parts[1] + '号'
              })
              .join('、')
          : '未分配'
        var faceImg = document.getElementById('dFaceImage')
        if (p.faceBase64Image) {
          faceImg.src = 'data:image/png;base64,' + p.faceBase64Image
          faceImg.style.display = 'block'
        } else {
          faceImg.style.display = 'none'
          faceImg.removeAttribute('src')
        }
      }

      function logBridge(message, data) {
        console.log(
          '[' +
            new Date().toLocaleTimeString('zh-CN', { hour12: false }) +
            '] ' +
            message,
          data || ''
        )
      }

      function invokeAndroid(payload) {
        logBridge('invoke', payload)
        if (
          window.jsInterface &&
          typeof window.jsInterface.invokeMethods === 'function'
        ) {
          window.jsInterface.invokeMethods(JSON.stringify(payload))
          return
        }
        simulateAndroid(payload)
      }

            }),

          doFaceDetect: () =>

      function getLockSt() {
        invokeAndroid({ action: 'getLockSt' })
      }

      function openLock() {
        invokeAndroid({ action: 'openLock' })
      }

        invokeAndroid({
          action: 'openMotorLock',
          layer: String(layer),
          numb: String(numb)
        })
      }

        invokeAndroid({ action: 'doQueryUserPoList' })
      }

        invokeAndroid({ action: 'doQueryDevicePoList' })
      }

        invokeAndroid({ action: 'doFaceCollect', idNoUnique: idNoUnique || '' })
      }

      function doFaceDetect(operateTypeTemp) {
        var operateType = operateTypeTemp || '0'
        invokeAndroid({ action: 'doFaceDetect', operateType: operateType })
      }

        invokeAndroid({
          action: 'doMgrLogin',
          mgrLoginName: mgrLoginName,
          mgrPwd: mgrPwd
        })
      }

      function doUpdateDevicePoBindNoBySlotNoUnique(deviceJsonArrayStr) {
        invokeAndroid({
          action: 'doUpdateDevicePoBindNoBySlotNoUnique',
          deviceJsonArrayStr: deviceJsonArrayStr
        })
      }

      function doMgrLoginCallback(jsonObj) {
        logBridge('doMgrLoginCallback', jsonObj)
        if (jsonObj.code == 0) {
          _loginPending = 2
          doQueryUserPoList()
          doQueryDevicePoList()
        } else {
          showToast('登录失败：' + (jsonObj.msg || '用户名或密码错误'))
        }
      }

      function doUpdateDevicePoBindNoBySlotNoUniqueCallback(jsonObj) {
        logBridge('doUpdateDevicePoBindNoBySlotNoUniqueCallback', jsonObj)
        if (jsonObj.code == 0) {
          if (jsonObj.devicePoListJsonStr) {
            var list =
              typeof jsonObj.devicePoListJsonStr === 'string'
                ? JSON.parse(jsonObj.devicePoListJsonStr)
                : jsonObj.devicePoListJsonStr
            list.forEach(function (d) {
              var parts = d.slotNoUnique ? d.slotNoUnique.split('_') : []
              if (parts.length !== 2) return
              var layer = parseInt(parts[0], 10)
              var numb = parseInt(parts[1], 10)
              var slot = state.slots.find(function (s) {
                return s.layer === layer && s.numb === numb
              })
              if (!slot) return
              slot.disconnected =
                d.status === '1' || d.status === '2' || d.useStatus === '2'
              slot.occupied = d.useStatus === '1'
              if (d.bindNo && d.bindNo !== '') {
                if (!slot.idNos.includes(d.bindNo)) slot.idNos.push(d.bindNo)
              } else {
                slot.idNos = []
              }
              slot.uid = d.uid || ''
              var dev = state.deviceList.find(function (x) {
                return x.slotNoUnique === d.slotNoUnique
              })
              if (dev) {
                dev.bindNo = d.bindNo || ''
                dev.useStatus = d.useStatus || '0'
                dev.status = d.status || '0'
                dev.uid = d.uid || ''
              }
            })
          }
          if (state.currentScreen === 'manageScreen' && state.selectedPerson) {
            renderDetail(state.selectedPerson)
          }
          var overlay = document.getElementById('slotBindOverlay')
          if (!overlay.classList.contains('hidden')) {
            openSlotBind()
          }
          showToast((_lastBindAction || '操作') + '成功')
        } else {
          showToast('绑定/解绑失败：' + (jsonObj.msg || ''))
        }
      }

      function getLockStCallback(jsonObj) {
        logBridge('getLockStCallback', {
          lockSt: jsonObj.lockSt,
          mode: state.mode,
          screen: state.currentScreen
        })
        if (
          state.mode === 'retrieve' &&
          state.currentScreen === 'certificateScreen' &&
          jsonObj.lockSt == 1
        ) {
          logBridge('getLockStCallback matched, going home')
          showScreen('homeScreen', false)
        }
      }

      function openLockCallback(jsonObj) {
        logBridge('openLockCallback', jsonObj)
        if (jsonObj.code == 0) {
          renderCertificate(state.mode)
          showScreen('certificateScreen')
        } else {
          document.getElementById('authState').textContent =
            '开锁失败：' + (jsonObj.msg || '柜门异常')
        }
      }

      function openMotorLockCallback(jsonObj) {
        const success = jsonObj.code == 0
        if (success && state.selectedSlot) {
          if (state.mode === 'retrieve') {
            state.selectedSlot.occupied = false
            document.getElementById('sideStatus').textContent = '空闲'

            renderManageList([])

          }
        }
        // 注意：这里不调用 _syncDone()，因为人脸识别流程中需要等待锁孔信息
        if (!_authDevicePending) {

        }

              //     Array.isArray(bindNoArray) &&

      function termFaceCallback(jsonObj) {
        logBridge('termFaceCallback 人脸识别返回', jsonObj)
        logBridge('当前人员列表长度:', state.personnel.length)
        logBridge('当前锁孔列表长度:', state.slots ? state.slots.length : 0)
        logBridge(

              if (jsonObj.termFaceImageBase64Str) {

            logBridge('人脸识别成功，先刷新人员列表...')
            doQueryUserPoList()
          } else if (jsonObj.action === 'doFaceCollect') {
            showToast('采集成功')

              state.selectedPerson.faceBase64Image =
                jsonObj.termFaceImageBase64Str
              renderDetail(state.selectedPerson)

            closeFaceCapture()
            doQueryUserPoList()

          if (jsonObj.action === 'doFaceDetect') {
            document.getElementById('authState').textContent =

            showToast('采集失败：' + (jsonObj.msg || ''))

      function updateDeviceList(devicePoListJsonStr) {
        try {
          const list =
            typeof devicePoListJsonStr === 'string'
              ? JSON.parse(devicePoListJsonStr)
              : devicePoListJsonStr
          logBridge('updateDeviceList 解析后的列表长度:', list.length)
          if (list.length > 0) {
            logBridge('updateDeviceList 第一个设备:', list[0])
            logBridge(
              '第一个设备的 bindNo:',
              list[0].bindNo,
              '类型:',
              typeof list[0].bindNo
            )
            // 检查 bindNo 是否是 JSON 字符串
            if (list[0].bindNo && list[0].bindNo.startsWith('[')) {
              try {
                const parsed = JSON.parse(list[0].bindNo)
                logBridge('bindNo 看起来是 JSON 数组:', parsed)
              } catch (e) {}
            }
          }
          state.deviceList = list
          state.slots.forEach(s => {
            s.idNos = []
            s.disconnected = true
            s.occupied = false
          })
          list.forEach(d => {
            var parts = d.slotNoUnique ? d.slotNoUnique.split('_') : []
            if (parts.length !== 2) return
            var layer = parseInt(parts[0], 10)
            var numb = parseInt(parts[1], 10)
            var slot = state.slots.find(
              s => s.layer === layer && s.numb === numb
            )
            if (!slot) return
            slot.disconnected =
              d.status === '1' || d.status === '2' || d.useStatus === '2'
            slot.occupied = d.useStatus === '1'
            if (d.bindNo && d.bindNo !== '') {
              slot.bindNo = d.bindNo // 保存原始 bindNo 值
              // 尝试解析 bindNo，可能是 JSON 数组字符串或单个身份证号
              try {
                if (d.bindNo.startsWith('[') && d.bindNo.endsWith(']')) {
                  // 是 JSON 数组格式
                  const idNos = JSON.parse(d.bindNo)
                  if (Array.isArray(idNos)) {
                    idNos.forEach(idNo => {
                      if (idNo && !slot.idNos.includes(idNo))
                        slot.idNos.push(idNo)
                    })
                  }
                } else {
                  // 单个身份证号字符串
                  if (!slot.idNos.includes(d.bindNo)) slot.idNos.push(d.bindNo)
                }
              } catch (e) {
                logBridge('解析 bindNo 出错:', d.bindNo, e)
                // 如果解析失败，当作单个身份证号处理
                if (!slot.idNos.includes(d.bindNo)) slot.idNos.push(d.bindNo)
              }
            }
          })
          // 更新后输出几个锁孔的状态
          state.slots.slice(0, 10).forEach((slot, i) => {
            logBridge(
              `更新后锁孔${i + 1}: layer=${slot.layer}, numb=${
                slot.numb
              }, occupied=${slot.occupied}, idNos=${JSON.stringify(slot.idNos)}`
            )
          })
        } catch (e) {
          logBridge('updateDeviceList parse error', e)
        }
      }

      let sbSelectedSlot = null
      let _lastBindAction = ''

      function openSlotBind() {
        const p = state.selectedPerson
        if (!p) {
          alert('请先选择一位人员')
          return
        }
        sbSelectedSlot = null
        const idNo = p.idNoUnique || ''
        const allowedKeys = parseSlotPositions(p.slotPositions)
        document.getElementById('sbTargetName').textContent =
          idNo + ' ' + (p.userName || p.name || '')
        document.getElementById('sbConfirm').disabled = true
        document.getElementById('sbConfirm').textContent = '确认绑定'

        const grid = document.getElementById('sbGrid')
        grid.replaceChildren()
        const layers = [...new Set(state.slots.map(s => s.layer))].sort(
          (a, b) => a - b
        )
        layers.forEach(layer => {
          const slots = state.slots.filter(
            s => s.layer === layer && s && !s.disconnected
          )
          if (!slots.length) return
          const label = document.createElement('div')
          label.className = 'sb-slot-layer'
          label.textContent = `第${layer}层`
          grid.appendChild(label)
          for (let numb = 1; numb <= 5; numb++) {
            const slot = slots.find(s => s.numb === numb)
            if (!slot) continue
            const btn = document.createElement('button')
            btn.className = 'sb-slot'
            btn.dataset.num = (layer - 1) * 5 + numb
            const isMine =
              (slot.idNos && slot.idNos.includes(idNo)) ||
              allowedKeys.has(slot.layer + '_' + slot.numb)
            if (isMine) {
              btn.classList.add('mine')
              btn.addEventListener('click', () => {
                document
                  .querySelectorAll('#sbGrid .sb-slot.selected')
                  .forEach(el => el.classList.remove('selected'))
                btn.classList.add('selected')
                sbSelectedSlot = { slot, unbind: true }
                document.getElementById('sbConfirm').disabled = false
                document.getElementById('sbConfirm').textContent = '解绑'
              })
            } else if (slot.idNos && slot.idNos.length > 0) {
              btn.classList.add('occupied')
            } else {
              btn.classList.add('free')
              btn.addEventListener('click', () => {
                document
                  .querySelectorAll('#sbGrid .sb-slot.selected')
                  .forEach(el => el.classList.remove('selected'))
                btn.classList.add('selected')
                sbSelectedSlot = { slot, unbind: false }
                document.getElementById('sbConfirm').disabled = false
                document.getElementById('sbConfirm').textContent = '确认绑定'
              })
            }
            grid.appendChild(btn)
          }
        })

        document.getElementById('slotBindOverlay').classList.remove('hidden')
      }
